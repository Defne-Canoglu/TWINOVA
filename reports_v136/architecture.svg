<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1070" role="img"><title>TWINOVA 13.6: ortak karar çekirdeği ve yeni katmanlar</title><rect width="1100" height="1070" fill="#f4f7fa" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#36647a" /></marker></defs><text x="48" y="42" fill="#13374c" font-size="25" font-family="sans-serif" font-weight="700">TWINOVA 13.6 — decisions, evidence and research</text><rect x="40" y="80" width="470" height="110" rx="12" fill="white" stroke="#9ab3c3" /><text x="58" y="108" fill="#163b53" font-size="17" font-family="sans-serif" font-weight="700">Timestamped shared records</text><text x="58" y="133" fill="#345469" font-size="14" font-family="sans-serif">Sleep / eye-level light / environment / PVT trials</text><text x="58" y="156" fill="#345469" font-size="14" font-family="sans-serif">Identity, protocol, source, units, time, quality</text><rect x="590" y="80" width="470" height="110" rx="12" fill="white" stroke="#9ab3c3" /><text x="608" y="108" fill="#163b53" font-size="17" font-family="sans-serif" font-weight="700">Person-disjoint roles and frozen selection</text><text x="608" y="133" fill="#345469" font-size="14" font-family="sans-serif">72 train | 6 probability | 10 policy</text><text x="608" y="156" fill="#345469" font-size="14" font-family="sans-serif">20 calibration | 20 test; separate targets</text><rect x="40" y="250" width="470" height="115" rx="12" fill="white" stroke="#9ab3c3" /><text x="58" y="278" fill="#163b53" font-size="17" font-family="sans-serif" font-weight="700">Feature and measurement pipeline</text><text x="58" y="303" fill="#345469" font-size="14" font-family="sans-serif">Forger99 x/xc/n + homeostat S + exposure</text><text x="58" y="326" fill="#345469" font-size="14" font-family="sans-serif">Suitability and at most 2 h carry-forward</text><rect x="590" y="250" width="470" height="150" rx="12" fill="white" stroke="#9ab3c3" /><text x="608" y="278" fill="#163b53" font-size="17" font-family="sans-serif" font-weight="700">One decision kernel: Engine.decide</text><text x="608" y="303" fill="#345469" font-size="14" font-family="sans-serif">Observation / event model + personal history</text><text x="608" y="326" fill="#345469" font-size="14" font-family="sans-serif">Measurement policy + interval / validity checks</text><text x="608" y="349" fill="#345469" font-size="14" font-family="sans-serif">A/B/N/C + alarm + interval + next action</text><rect x="40" y="465" width="470" height="135" rx="12" fill="white" stroke="#9ab3c3" /><text x="58" y="493" fill="#163b53" font-size="17" font-family="sans-serif" font-weight="700">Post-decision H1–H5 evidence</text><text x="58" y="518" fill="#345469" font-size="14" font-family="sans-serif">Sleep | phase | workload | device | combined</text><text x="58" y="541" fill="#345469" font-size="14" font-family="sans-serif">Available records only; no new measurement</text><text x="58" y="564" fill="#345469" font-size="14" font-family="sans-serif">Record IDs / time / counterevidence / missingness</text><rect x="590" y="465" width="470" height="135" rx="12" fill="white" stroke="#9ab3c3" /><text x="608" y="493" fill="#163b53" font-size="17" font-family="sans-serif" font-weight="700">Shared application: UI / API / CLI</text><text x="608" y="518" fill="#345469" font-size="14" font-family="sans-serif">Body map + quality + hazard information</text><text x="608" y="541" fill="#345469" font-size="14" font-family="sans-serif">Progress + virtual communication + scenarios</text><text x="608" y="564" fill="#345469" font-size="14" font-family="sans-serif">Shared decision object; HTTP timeout</text><rect x="40" y="675" width="470" height="160" rx="12" fill="white" stroke="#9ab3c3" /><text x="58" y="703" fill="#163b53" font-size="17" font-family="sans-serif" font-weight="700">Versioned research assessments</text><text x="58" y="728" fill="#345469" font-size="14" font-family="sans-serif">Eight variants; matched acquisition roles</text><text x="58" y="751" fill="#345469" font-size="14" font-family="sans-serif">Person bootstrap; RK45 / phase pairing</text><text x="58" y="774" fill="#345469" font-size="14" font-family="sans-serif">Three Mars schedules; wake-rate candidate</text><text x="58" y="797" fill="#345469" font-size="14" font-family="sans-serif">Conditions + quality + paired differences</text><rect x="590" y="675" width="470" height="160" rx="12" fill="white" stroke="#9ab3c3" /><text x="608" y="703" fill="#163b53" font-size="17" font-family="sans-serif" font-weight="700">Isolated scenarios and assurance</text><text x="608" y="728" fill="#345469" font-size="14" font-family="sans-serif">Input scenario → features → same Engine</text><text x="608" y="751" fill="#345469" font-size="14" font-family="sans-serif">Virtual bench: 48 cases; 4 accept / 44 reject</text><text x="608" y="774" fill="#345469" font-size="14" font-family="sans-serif">Ground queue: 1200 / 2400 s virtual time</text><text x="608" y="797" fill="#345469" font-size="14" font-family="sans-serif">NASA / CSA information is not a target</text><rect x="250" y="910" width="600" height="110" rx="12" fill="white" stroke="#9ab3c3" /><text x="268" y="938" fill="#163b53" font-size="17" font-family="sans-serif" font-weight="700">Recorded results and verification</text><text x="268" y="963" fill="#345469" font-size="14" font-family="sans-serif">Hash-linked models / predictions / figures</text><text x="268" y="986" fill="#345469" font-size="14" font-family="sans-serif">Python / HTTP checks; layout not inspected</text><path d="M 275 190 L 275 250" stroke="#36647a" fill="none" stroke-width="2" marker-end="url(#arrow)" /><path d="M 825 190 L 825 250" stroke="#36647a" fill="none" stroke-width="2" marker-end="url(#arrow)" /><path d="M 510 310 L 590 310" stroke="#36647a" fill="none" stroke-width="2" marker-end="url(#arrow)" /><path d="M 40 135 L 20 135 L 20 530 L 40 530" stroke="#36647a" fill="none" stroke-width="2" marker-end="url(#arrow)" /><path d="M 825 400 L 825 430 L 275 430 L 275 465" stroke="#36647a" fill="none" stroke-width="2" marker-end="url(#arrow)" /><path d="M 880 400 L 880 465" stroke="#36647a" fill="none" stroke-width="2" marker-end="url(#arrow)" /><path d="M 510 530 L 590 530" stroke="#36647a" fill="none" stroke-width="2" marker-end="url(#arrow)" /><path d="M 40 745 L 10 745 L 10 310 L 40 310" stroke="#36647a" fill="none" stroke-width="2" marker-end="url(#arrow)" /><path d="M 1060 750 L 1080 750 L 1080 325 L 1060 325" stroke="#36647a" fill="none" stroke-width="2" marker-end="url(#arrow)" /><path d="M 275 835 L 275 870 L 450 870 L 450 910" stroke="#36647a" fill="none" stroke-width="2" marker-end="url(#arrow)" /><path d="M 825 835 L 825 870 L 650 870 L 650 910" stroke="#36647a" fill="none" stroke-width="2" marker-end="url(#arrow)" /><text x="40" y="1050" fill="#526f80" font-size="12" font-family="sans-serif">Frozen default model and data retained. Research prototype; no clinical, physical or NASA certification.</text></svg>